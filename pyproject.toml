[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyLeman2000"
version = "0.1.0"
description = "Python wrapper for Leman's (2000) tonal contextuality model"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Peter M. C. Harrison" },
]
dependencies = [
    "docker>=7.0.0",
    "numpy>=1.24",
    "pandas>=2.0",
]

[project.urls]
Homepage = "https://github.com/cms-cambridge/pyLeman2000"
Repository = "https://github.com/cms-cambridge/pyLeman2000"
Issues = "https://github.com/cms-cambridge/pyLeman2000/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pyleman2000"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that require Docker and the leman_2000 image (not skipped)",
]
