name: pytest

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: pytest-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: pip install ".[dev]"

      - name: Run unit tests
        run: pytest -v -m "not integration"

  package:
    name: Build package
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Build distributions
        run: |
          pip install build
          python -m build

      - name: Smoke-test wheel
        run: |
          python -m venv /tmp/pyleman-smoke
          /tmp/pyleman-smoke/bin/pip install dist/*.whl
          /tmp/pyleman-smoke/bin/python -c \
            "from pyleman2000 import example_wav_path; assert example_wav_path().is_file()"

  integration:
    name: Docker integration tests
    needs: [unit, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: pip install ".[dev]"

      - name: Build Octave model image
        run: ./scripts/build_octave_image.sh

      - name: Run integration tests
        run: pytest -v -m integration
