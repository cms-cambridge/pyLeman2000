name: pytest

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pytest-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: pip install ".[dev]"

      - name: Run unit tests
        run: pytest -v -m "not integration"

  package:
    name: Build package
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build distributions
        run: |
          pip install build
          python -m build

      - name: Smoke-test wheel
        run: |
          python -m venv /tmp/pyleman-smoke
          /tmp/pyleman-smoke/bin/pip install dist/*.whl
          /tmp/pyleman-smoke/bin/python -c \
            "from pyleman2000 import example_wav_path; assert example_wav_path().is_file()"

  integration:
    name: Docker integration tests
    needs: [unit, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: pip install ".[dev]"

      - name: Pull Leman 2000 Docker image
        run: |
          docker pull "$(python -c \
            'from pyleman2000.docker_runner import DEFAULT_IMAGE; print(DEFAULT_IMAGE)')"

      - name: Run integration tests
        run: pytest -v -m integration
